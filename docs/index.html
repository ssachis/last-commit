<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Last Commit — they leave, their world of work stays. A design prototype for onboarding into a departed teammate's codebase.">
</head>
<body>
<title>Last Commit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>

/* Last Commit — design system
   Grid: sidebar 240 + content (max 1440). 8px spacing scale: 8 / 16 / 24 / 32 / 48.
   Type: 34 display · 20 section · 15 body · 13 meta. Inter throughout, handwriting only on John's whiteboard.
   Color: white canvas, one ink, one grey. Pastels (mint / yellow / rose / blue / violet) carry meaning. */
:root {
  --ink: #141a21;
  --ink-2: #3c4855;
  --grey: #7a8594;
  --grey-2: #a9b2bd;
  --line: #eceff3;
  --canvas: #ffffff;
  --wash: #f6f8fa;
  --mint: #2f9f6a; --mint-50: #eaf8f1; --mint-100: #d3f2e2;
  --yellow: #f2b524; --yellow-50: #fff8e3; --yellow-100: #ffefc2;
  --rose: #ef4f5f; --rose-50: #fff1f2; --rose-100: #ffdfe2;
  --blue: #3c7be6; --blue-50: #eef4ff; --blue-100: #dae7ff;
  --violet: #7b68d9; --violet-50: #f3f0ff; --violet-100: #e4ddff;
  --r: 18px;
  --shadow: 0 1px 2px rgba(20, 26, 33, .03), 0 12px 32px rgba(20, 26, 33, .05);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  color-scheme: light;
  font-family: var(--font);
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: border-box; }
@layer base {
  body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); font-size: 15px; line-height: 1.5; }
  h1, h2, h3, p { margin: 0; text-wrap: balance; }
  ol, ul { margin: 0; padding: 0; list-style: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
  button:disabled { cursor: default; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  blockquote { margin: 0; }
}
:where(button, a, input, select, [role="button"]):focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { flex: 0 0 auto; }

/* tints */
.tint--mint { background: var(--mint-50); color: var(--mint); }
.tint--yellow { background: var(--yellow-50); color: #b07f0b; }
.tint--rose { background: var(--rose-50); color: var(--rose); }
.tint--blue { background: var(--blue-50); color: var(--blue); }
.tint--violet { background: var(--violet-50); color: var(--violet); }

/* logo */
.logo { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; line-height: .95; letter-spacing: -.04em; color: var(--ink); }
.logo--compact { gap: 6px; font-size: 22px; }
.logo-mark { width: 52px; height: 76px; position: relative; display: block; flex: 0 0 auto; }
.logo--compact .logo-mark { transform: scale(.58); transform-origin: left top; margin: 0 -20px -32px 0; }
.logo-mark::before { content: ""; position: absolute; left: 24px; top: 10px; width: 3px; height: 58px; background: #151b21; transform: rotate(-6deg); border-radius: 3px; }
.logo-mark::after { content: ""; position: absolute; left: 5px; top: 14px; width: 22px; height: 3px; background: #151b21; transform: rotate(-15deg); border-radius: 3px; }
.logo-mark i { position: absolute; width: 25px; height: 25px; border: 3px solid #151b21; border-radius: 50%; z-index: 1; background: #ff5d63; }
.logo-mark i:nth-child(1) { left: 27px; top: 0; }
.logo-mark i:nth-child(2) { left: 20px; top: 25px; background: #ffd57e; }
.logo-mark i:nth-child(3) { left: 22px; top: 51px; background: #67bf8b; }
.logo-mark i:nth-child(4) { width: 15px; height: 15px; left: 0; top: 10px; background: #379965; border: 0; border-radius: 100% 0 100% 0; transform: rotate(-15deg); }

/* avatars & photos */
.avatar { position: relative; flex: 0 0 auto; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; letter-spacing: -.02em; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.hue-mint { background: var(--mint-100); color: #17694a; }
.hue-blue { background: var(--blue-100); color: #2453a3; }
.hue-violet { background: var(--violet-100); color: #5640b8; }
.hue-rose { background: var(--rose-100); color: #b42335; }
.hue-yellow { background: var(--yellow-100); color: #8a6209; }
.presence { position: absolute; right: 0; bottom: 0; width: 28%; height: 28%; min-width: 9px; min-height: 9px; border-radius: 50%; border: 2px solid var(--canvas); background: var(--grey-2); }
.presence--online { background: var(--mint); } .presence--away { background: var(--yellow); } .presence--you { display: none; }
.photo-fallback { display: grid; place-items: center; width: 100%; height: 100%; background: linear-gradient(135deg, var(--mint-100), var(--blue-100)); }
.photo-fallback b { font-size: clamp(28px, 6vw, 72px); font-weight: 800; color: #17694a; letter-spacing: -.04em; opacity: .8; }

/* shared */
.panel { background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.panel-head h2, .panel > h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.see { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--grey); }
.see:hover { color: var(--ink); }
.see--blue { color: var(--blue); }
.sdot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--grey-2); }
.sdot--stable { background: var(--mint); } .sdot--needs-review { background: var(--yellow); } .sdot--high-risk { background: var(--rose); }
.bot { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 0 0 auto; box-shadow: 0 0 0 4px var(--wash); }
.bot i { width: 6px; height: 8px; border-radius: 3px; background: #7ff0bd; }
.play { position: absolute; left: 20px; bottom: 20px; display: inline-flex; align-items: center; gap: 12px; padding: 8px 18px 8px 8px; border-radius: 999px; background: rgba(14, 19, 24, .82); color: #fff; font-size: 14px; font-weight: 500; backdrop-filter: blur(8px); }
.play b { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; }
.title { display: grid; gap: 8px; }
.title h1 { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
.title p { color: var(--grey); font-size: 16px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mint); }
.ask-bar { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px 0 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--canvas); box-shadow: var(--shadow); }
.ask-bar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); }
.ask-bar input::placeholder { color: var(--grey-2); }
.ask-bar button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--mint); color: #fff; }
.ask-bar button:disabled { background: var(--line); color: var(--grey-2); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; z-index: 60; }

/* welcome — fits one screen: brand + card on the left, photo panel bleeding off the right edge */
.welcome { position: relative; height: 100vh; height: 100dvh; min-height: 680px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 48%) minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 32px; padding-block: clamp(28px, 5.5vh, 60px); padding-left: max(16px, env(safe-area-inset-left, 0px), 4.4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4.4vw); background: radial-gradient(ellipse at 85% 0%, #f1f2f0 0%, rgba(241, 242, 240, 0) 55%), linear-gradient(180deg, #fbfbfa, #ffffff); }
.welcome-top { grid-column: 1; position: relative; z-index: 2; }
.brand { display: flex; align-items: flex-start; gap: 18px; }
.brand-word { display: block; font-size: clamp(28px, min(3vw, 4.6vh), 44px); font-weight: 800; line-height: .98; letter-spacing: -.04em; color: var(--ink); margin-top: 8px; }
.brand p { margin-top: 10px; font-size: clamp(14px, min(1.25vw, 2vh), 18px); color: var(--grey); }
.welcome-photo { position: relative; grid-column: 2; grid-row: 2; align-self: center; justify-self: end; margin-top: 2vh; width: min(100%, 640px); max-height: 66vh; aspect-ratio: 5 / 6; border-radius: 28px; overflow: hidden; background: linear-gradient(135deg, #eef3ef, #f5f6f8); box-shadow: 0 30px 70px rgba(20, 26, 33, .08); }
.welcome-photo img, .welcome-photo .photo-fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 25%; }
.welcome-photo .photo-fallback { background: radial-gradient(circle at 55% 40%, #e2efe7, #f4f5f7 65%); }
.welcome-photo::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: none; }
.wall-note { position: absolute; top: 6%; right: 6%; z-index: 1; padding: 14px 18px 16px; background: #f3ead9; box-shadow: 0 10px 24px rgba(60, 48, 30, .12); transform: rotate(-4deg); font-family: var(--hand); font-size: clamp(17px, 1.5vw, 23px); line-height: 1.12; color: #3a3530; }
.wall-note em { display: block; margin-top: 6px; font-style: normal; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 6px; }
.welcome-card { grid-column: 1; position: relative; z-index: 2; align-self: center; margin-top: 2vh; padding: clamp(24px, 5vh, 64px) clamp(28px, 4.4vw, 64px); border-radius: 28px; border: 1px solid #eceef0; background: rgba(255, 255, 255, .9); box-shadow: 0 30px 70px rgba(20, 26, 33, .05); display: flex; flex-direction: column; gap: clamp(14px, 3vh, 34px); }
.welcome-card h1 { font-size: clamp(36px, min(5vw, 7.4vh), 76px); font-weight: 800; letter-spacing: -.045em; line-height: 1.04; }
.welcome-card h1 em { font-style: normal; color: #1f4d39; }
.wave { display: inline-block; font-size: .8em; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out 1s 2; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-8deg); } }
.welcome-card > p { font-size: clamp(16px, min(1.6vw, 2.5vh), 24px); line-height: 1.5; color: var(--grey); max-width: 34ch; margin-top: -6px; }
.nowrap { white-space: nowrap; }
.shortcuts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.shortcuts button { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.4vh, 14px); white-space: nowrap; font-size: clamp(13px, min(1.15vw, 1.9vh), 17px); color: var(--ink-2); transition: transform .2s; }
.shortcuts button:hover { transform: translateY(-3px); color: var(--ink); }
.sc-icon { width: clamp(52px, min(5.4vw, 8.4vh), 82px); aspect-ratio: 1; border-radius: 20px; display: grid; place-items: center; }
.sc-icon.tint--blue { color: #3a4f7a; } .sc-icon.tint--violet { color: #4b3a8f; } .sc-icon.tint--rose { color: #8f3a45; } .sc-icon.tint--yellow { color: #6b5212; } .sc-icon.tint--mint { color: #1f4d39; }
.enter { height: clamp(56px, 8vh, 88px); border-radius: 18px; background: #18202a; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 44px 0 46px; font-size: clamp(17px, min(1.7vw, 2.6vh), 24px); font-weight: 500; transition: background .2s; }
.enter:hover { background: #0a0e12; }
@media (max-width: 900px) {
  .welcome { height: auto; min-height: 100vh; overflow: visible; grid-template-columns: minmax(0, 1fr); }
  .welcome-photo { position: absolute; left: 0; right: 0; top: 0; width: 100%; max-height: none; aspect-ratio: auto; margin: 0; height: 44vh; border-radius: 0; box-shadow: none; }
  .welcome-photo::after { content: ""; position: absolute; inset: 0; }
  .welcome-photo::after { background: linear-gradient(0deg, #ffffff 0%, rgba(255, 255, 255, 0) 45%); }
  .wall-note { display: none; }
  .welcome-card { margin-top: 26vh; align-self: start; }
  .brand { background: rgba(255, 255, 255, .85); padding: 10px 16px 10px 10px; border-radius: 18px; align-self: start; width: fit-content; }
}
@media (max-width: 520px) {
  .shortcuts { gap: 6px; }
  .sc-icon { width: 54px; border-radius: 16px; }
  .shortcuts button { font-size: 12px; gap: 8px; }
  .enter { padding: 0 24px; }
  .brand-word { font-size: 28px; }
  .brand p { display: none; }
}

/* shell */
.shell { min-height: 100vh; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
.side { position: sticky; top: 0; height: 100vh; padding: 32px 20px; border-right: 1px solid var(--line); background: var(--canvas); z-index: 10; }
.side .logo { margin-left: 12px; }
.side nav { margin-top: 56px; display: grid; gap: 8px; }
.side nav button { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-radius: 14px; font-size: 16px; color: var(--ink-2); }
.side nav button:hover { background: var(--wash); }
.side nav button.active { background: var(--mint-50); color: #176d4b; font-weight: 600; }
.main { min-width: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-left: max(24px, env(safe-area-inset-left, 0px), 3vw); padding-right: max(24px, env(safe-area-inset-right, 0px), 3vw); background: rgba(255, 255, 255, .92); backdrop-filter: blur(12px); }
.search { flex: 0 1 520px; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-radius: 14px; background: var(--wash); color: var(--grey); min-width: 0; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); }
.search input::placeholder { color: var(--grey-2); }
.me { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; padding: 4px; border-radius: 999px; }
.screen { max-width: 1440px; margin: 0 auto; padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px), 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 3vw); display: flex; flex-direction: column; gap: 32px; }
.screen.narrow { max-width: 1200px; }

/* home */
.home { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: 32px; align-items: start; }
.home-main { display: flex; flex-direction: column; gap: 24px; }
.hello { display: grid; gap: 8px; }
.hello h1 { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
.hello p { color: var(--grey); font-size: 16px; }
.hero { position: relative; display: block; width: 100%; aspect-ratio: 16 / 8.2; max-width: 100%; border-radius: 22px; overflow: hidden; background: var(--wash); box-shadow: var(--shadow); }
.hero-img, .hero .photo-fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transition: transform .6s ease; }
.hero:hover .hero-img { transform: scale(1.02); }
.hero-note { position: absolute; right: 6%; top: 12%; font-family: var(--hand); font-size: clamp(18px, 2vw, 26px); line-height: 1.1; color: #3a4048; transform: rotate(-3deg); text-align: left; }
.hero-note em { display: block; margin-top: 8px; font-style: normal; text-align: right; }
.prompt { display: flex; flex-direction: column; gap: 16px; }
.prompt-q { display: flex; align-items: center; gap: 16px; }
.prompt-q p { background: var(--mint-50); padding: 12px 18px; border-radius: 4px 16px 16px 16px; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 56px; }
.chips button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); background: var(--canvas); transition: border-color .2s, background .2s; }
.chips button:hover { border-color: #b9e3cc; background: var(--mint-50); }
.home-side { display: flex; flex-direction: column; gap: 24px; padding-top: 4px; }
.repo-list li + li { border-top: 1px solid var(--line); }
.repo-list button { width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 0; }
.repo-list button > span { flex: 1; display: grid; min-width: 0; }
.repo-list strong { font-size: 15px; font-weight: 600; }
.repo-list small { font-size: 13px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.repo-list button:hover strong { color: #176d4b; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.bars i { width: 4px; border-radius: 2px; background: var(--blue); }
.bars i:nth-child(1) { height: 8px; } .bars i:nth-child(2) { height: 16px; } .bars i:nth-child(3) { height: 11px; }
.health-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 3px; margin-bottom: 16px; }
.health-bar i { border-radius: 99px; }
.hb--stable { background: var(--mint); opacity: .8; } .hb--needs-review { background: var(--yellow); } .hb--high-risk { background: var(--rose); } .hb--unknown { background: var(--grey-2); }
.health-list li { display: grid; grid-template-columns: 10px 1fr auto 40px; align-items: center; gap: 12px; padding: 8px 0; font-size: 14px; }
.health-list small { color: var(--grey); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }

/* repository */
.repo-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.gh { color: var(--ink); }
.repo-id { flex: 1; min-width: 240px; display: grid; gap: 2px; }
.repo-name { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.repo-name h1 { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
.repo-id p { color: var(--grey); font-size: 17px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.pill i { width: 12px; height: 12px; border-radius: 4px; }
.pill--needs-review { background: var(--yellow-50); color: #6b4d06; } .pill--needs-review i { background: var(--yellow); }
.pill--high-risk { background: var(--rose-50); color: #9b1c2c; } .pill--high-risk i { background: var(--rose); }
.pill--stable { background: var(--mint-50); color: #17694a; } .pill--stable i { background: var(--mint); }
.ask-people { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--grey); margin-right: 8px; }
.ask-people span { margin-right: 6px; }
.ask-people button { margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 3px var(--canvas); transition: transform .2s; }
.ask-people button:first-of-type { margin-left: 0; }
.ask-people button:hover { transform: translateY(-2px); }
.branch { position: relative; display: inline-flex; align-items: center; height: 48px; border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; gap: 24px; }
.branch select { appearance: none; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); outline: none; padding-right: 8px; max-width: 160px; }
.branch .icon { pointer-events: none; }
.gh-btn { height: 48px; display: inline-flex; align-items: center; gap: 12px; padding: 0 22px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 500; }
.gh-btn:hover { background: #0a0e12; }
.tabs { display: flex; gap: 40px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin-top: -8px; }
.tabs button { padding: 12px 4px 14px; font-size: 15px; color: var(--grey); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.repo-top { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 24px; align-items: stretch; }
.arch-panel { position: relative; padding: 16px; display: flex; flex-direction: column; background: linear-gradient(180deg, #fbfdfc, #ffffff); }
.legend { position: absolute; top: 20px; right: 24px; display: grid; gap: 6px; font-size: 12px; color: var(--grey); z-index: 1; }
.legend span { display: flex; align-items: center; gap: 10px; }
.lg { width: 26px; border-top: 2px dashed; }
.lg--request { border-color: #3fbf86; } .lg--data { border-color: var(--blue); } .lg--async { border-color: var(--yellow); }
.lens { position: absolute; top: 18px; left: 18px; z-index: 1; display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--wash); }
.lens button { padding: 6px 12px; border-radius: 9px; font-size: 13px; color: var(--grey); transition: background .2s, color .2s; }
.lens button:hover { color: var(--ink); }
.lens button.active { background: var(--canvas); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(20, 26, 33, .08); }
.arch { width: 100%; height: auto; display: block; flex: 1; }

.takeaways { background: var(--yellow-50); border-color: #f8e8b8; flex: 1; }

.repo-bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }

/* notes */

.feature-body { padding: 40px; display: flex; flex-direction: column; gap: 16px; justify-content: center; background: linear-gradient(160deg, var(--violet-50), #ffffff 70%); }

.tool p { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.ship { padding: 32px; }
.ship h2 { margin-bottom: 32px; }
.ship ol { display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }

.ship li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; color: var(--ink-2); text-align: center; }

.room-label { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.room-label--mint { fill: #2f9f6a; } .room-label--violet { fill: #7b68d9; } .room-label--rose { fill: #d9485a; } .room-label--yellow { fill: #b07f0b; } .room-label--plain { fill: #a3acb6; }
.room-note { font-size: 12px; fill: #8a6f4a; font-weight: 600; }
.desk { fill: #f1dfc1; stroke: #e2c99e; stroke-width: 1; }

.table { fill: #f1dfc1; stroke: #e2c99e; }
.chair { fill: #dfe3e8; }

.counter { fill: #ece6dc; }
.pot { fill: #e9dccb; } .leaf { fill: #8fcf9f; } .leaf-hi { fill: #b9e6c3; }
.seat { cursor: pointer; outline: none; }
.seat .ring { fill: #ffffff; stroke: transparent; stroke-width: 3; transition: stroke .2s; }
.seat:hover .ring { stroke: #cfe9db; }
.seat.is-sel .ring { stroke: var(--mint); }
.seat:focus-visible .ring { stroke: var(--ink); }
.ini { font-size: 16px; font-weight: 700; }
.pres { stroke: #fff; stroke-width: 2.5; fill: var(--grey-2); }
.pres--online { fill: var(--mint); } .pres--away { fill: var(--yellow); }
.seat-name { font-size: 16px; font-weight: 700; fill: var(--ink); }
.seat-role { font-size: 13px; fill: var(--grey); }
.outline { fill: none; stroke-width: 1.8; stroke-dasharray: 5 5; }
.outline--left { stroke: #f09aa4; } .outline--you { stroke: #b6a9f0; }
.wb rect { fill: #fff; stroke: #dfe3e8; }
.wb text { font-family: var(--hand); font-size: 18px; fill: #4a525b; }
.wb path { fill: none; stroke: #8a939d; stroke-width: 1.4; stroke-linecap: round; }

.profile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 32px 24px; position: sticky; top: 104px; }

.teams { margin-top: 16px; width: 100%; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 14px; background: #f1f2fc; color: #4a52b8; font-weight: 600; }
.teams:hover { background: #e7e9fa; }

/* advice */
.advice { max-width: 860px; min-height: calc(100vh - 88px); }
.convo { flex: 1; display: flex; flex-direction: column; gap: 24px; min-height: calc(100vh - 200px); }
.intro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding-block: 24px; }
.intro-photo { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; position: relative; box-shadow: 0 0 0 6px var(--mint-50); }
.intro-photo img, .intro-photo .photo-fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.intro-photo .photo-fallback b { font-size: 30px; }
.intro h1 { font-size: 34px; font-weight: 800; letter-spacing: -.04em; margin-top: 8px; }
.intro > p { color: var(--grey); font-size: 16px; max-width: 46ch; line-height: 1.55; }
.starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; margin-top: 24px; }
.starters button { display: grid; gap: 4px; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); text-align: left; transition: border-color .2s, background .2s; }
.starters button:hover { border-color: #b9e3cc; background: var(--mint-50); }
.starters strong { font-size: 15px; font-weight: 600; }
.starters small { font-size: 13px; color: var(--grey); }
.thread { flex: 1; display: flex; flex-direction: column; gap: 32px; overflow-y: auto; max-height: calc(100vh - 260px); padding: 8px 4px; }
.turn { display: grid; gap: 20px; }
.bubble { display: flex; gap: 14px; align-items: flex-start; }
.bubble--me { justify-content: flex-end; }
.bubble--me .avatar { display: none; }
.bubble--me p { background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 18px 18px 4px 18px; max-width: 75%; }
.agent-mark { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: 0 0 auto; }
.agent-mark i { width: 6px; height: 6px; border-radius: 50%; background: #ff5d63; }
.agent-mark i:nth-child(2) { background: #ffd57e; } .agent-mark i:nth-child(3) { background: #67bf8b; }
.bubble-body { flex: 1; min-width: 0; display: grid; gap: 12px; padding: 18px 20px; border-radius: 4px 18px 18px 18px; background: var(--mint-50); }
.bubble-body p { font-size: 15.5px; line-height: 1.65; }
.basis { justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #17694a; }
.basis--code { color: #2453a3; }
.basis--gap { color: #b42335; }
.source-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.source-chips button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--canvas); border: 1px solid #d3efe1; font-size: 13px; color: var(--ink-2); }
.source-chips button:hover { border-color: var(--mint); }
.route { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); padding-top: 12px; border-top: 1px solid #d3efe1; }
.route .teams-link { margin-left: auto; }
.teams-link { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; background: #f1f2fc; color: #4a52b8; font-size: 13px; font-weight: 600; }
.typing { display: flex; gap: 5px; padding: 12px 0 12px 50px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--grey-2); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .25; } }
.ask-bar--lg { height: 64px; position: sticky; bottom: 24px; }

/* responsive */
@media (max-width: 1200px) {
  .home, .repo-top, .team-grid { grid-template-columns: minmax(0, 1fr); }
  .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .profile { position: static; }
  .welcome-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 76px minmax(0, 1fr); }
  .side { padding: 24px 12px; }
  .side .logo span:last-child, .side nav span { display: none; }
  .side .logo { margin: 0 auto; }
  .side nav button { justify-content: center; padding: 0; }
  .repo-bottom, .cards3, .incidents, .notes { grid-template-columns: minmax(0, 1fr); }
  .feature { grid-template-columns: minmax(0, 1fr); }
  .feature-img { min-height: 220px; }
}
@media (max-width: 640px) {
  .shell { display: block; padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); border-right: 0; border-top: 1px solid var(--line); z-index: 30; }
  .side > .logo { display: none; }
  .side nav { margin: 0; display: flex; justify-content: space-around; }
  .side nav button { width: 48px; height: 48px; }
  .top { height: 72px; }
  .me span, .me .icon { display: none; }
  .hello h1, .title h1, .repo-name h1, .intro h1 { font-size: 28px; }
  .hero { aspect-ratio: 4 / 3; }
  .hero-note { display: none; }
  .chips, .src { padding-left: 0; }
  .tools, .starters { grid-template-columns: minmax(0, 1fr); }
  .ship ol { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .ship ol::before { display: none; }
  .ship li { flex-direction: row; text-align: left; }
  .walk-media { grid-template-columns: minmax(0, 1fr); height: auto; }
  .walk-photo { height: 180px; }
  .welcome-brand p { margin-left: 0; }
  .tabs { gap: 24px; }
  .legend { position: static; display: flex; flex-wrap: wrap; gap: 12px; padding: 8px; }
  .lens { position: static; align-self: flex-start; flex-wrap: wrap; }
  .arch { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* SonarQube + Jira panels */
.source { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--grey); white-space: nowrap; }
.src-dot { width: 10px; height: 10px; border-radius: 3px; }
.src-dot--sonar { background: #4e9bcd; } .src-dot--jira { background: #2684ff; }
.sonar-body { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cov-ring { width: 112px; height: 112px; }
.cov-track { fill: none; stroke: var(--line); stroke-width: 8; }
.cov-val { fill: none; stroke-width: 8; stroke-linecap: round; }
.cov-val--good { stroke: var(--mint); } .cov-val--ok { stroke: var(--yellow); } .cov-val--low { stroke: var(--rose); }
.cov-num { font-size: 19px; font-weight: 800; fill: var(--ink); letter-spacing: -.03em; }
.cov-lbl { font-size: 8.5px; fill: var(--grey); }
.gate { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.gate--pass { background: var(--mint-50); color: #17694a; } .gate--fail { background: var(--rose-50); color: #b42335; }
.ratings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
